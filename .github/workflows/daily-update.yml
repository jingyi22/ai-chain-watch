name: Daily AI Chain Briefing

on:
  schedule:
    # 北京时间周一至周五 07:00（早报）—— UTC 23:00 对应 Beijing 周一至周五
    - cron: '0 23 * * 0-4'
    # 北京时间周一至周五 20:00（收盘复盘）
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      type:
        description: '生成类型 (morning/review)，留空按当前UTC时间自动判断'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine briefing type
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.type }}" ]; then
            echo "type=${{ github.event.inputs.type }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 12 ]; then
              echo "type=morning" >> "$GITHUB_OUTPUT"
            else
              echo "type=review" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check if today is a trading day
        id: tradingday
        run: |
          RESULT=$(node scripts/check-trading-day.mjs "${{ steps.vars.outputs.type }}")
          echo "今日是否交易日: $RESULT"
          IS_TRADING=$(node -e "console.log(JSON.parse(process.argv[1]).isTradingDay)" "$RESULT")
          TRADING_DATE=$(node -e "console.log(JSON.parse(process.argv[1]).date)" "$RESULT")
          echo "isTradingDay=$IS_TRADING" >> "$GITHUB_OUTPUT"
          echo "tradingDate=$TRADING_DATE" >> "$GITHUB_OUTPUT"

      - name: Fetch market data
        if: steps.tradingday.outputs.isTradingDay == 'true'
        run: node scripts/fetch-market-data.mjs "${{ steps.tradingday.outputs.tradingDate }}" > /tmp/market-data.json

      - name: Generate briefing (LLM)
        if: steps.tradingday.outputs.isTradingDay == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/generate-briefing.mjs "${{ steps.vars.outputs.type }}" < /tmp/market-data.json > /tmp/briefing.json

      - name: Discover AI candidate stocks (LLM, non-blocking)
        if: steps.tradingday.outputs.isTradingDay == 'true'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/discover-candidates.mjs < /tmp/market-data.json > /tmp/candidates.json

      - name: Discover industry signal candidates (LLM, non-blocking)
        if: steps.tradingday.outputs.isTradingDay == 'true'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/discover-industry-signals.mjs < /tmp/market-data.json > /tmp/signal-candidates.json

      - name: Write data/daily.json
        if: steps.tradingday.outputs.isTradingDay == 'true'
        run: node scripts/write-data.mjs "${{ steps.vars.outputs.type }}" /tmp/market-data.json /tmp/briefing.json data/daily.json /tmp/candidates.json /tmp/signal-candidates.json

      - name: Commit and push
        if: steps.tradingday.outputs.isTradingDay == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily briefing data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
